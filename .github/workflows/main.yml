name: Build my Angula App

on: 
 push:
   branches: [ main ]

jobs:
  build-angular-app:
   runs-on: ubuntu-latest

   steps:
     - uses: actions/setup-node@v4
     - uses: actions/setup-node@v7.1.0
       with:
         node-version: 22.x
     - name: Install Dependencies
       run: npm install
     - name: Build Angular App
       run: npm run Build
